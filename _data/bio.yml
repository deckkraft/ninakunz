text: 'Nina Kunz wurde 1993 geboren, studierte Sozial- und Wirtschaftsgeschichte in Zürich und arbeitet seit 2017 als Kolumnistin und Journalistin für <i>Das Magazin</i>. Ihre Texte erschienen bereits in der <i>Neuen Zürcher Zeitung</i>, der <i>ZEIT</i> und dem Z<i>EITmagazin</i>. 2018 sowie 2020 wurde sie zur <i>Kolumnistin des Jahres</i> gewählt. Seit 2024 ist sie festes Mitglied der Kritik:erinnenrunde des <a href="https://www.srf.ch/sendungen/literaturclub/literaturclub-nina-kunz">Literaturclubs</a> im SRF.'

